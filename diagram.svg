<path d="M 0 0 L 10 5 L 0 10 z" fill="#5F6368"/>
</marker>
</defs>
<text x="660" y="48" text-anchor="middle" font-family="sans-serif" font-size="28" fill="#5F6368">Whiteboard-to-Cloud - Generated Architecture</text>

