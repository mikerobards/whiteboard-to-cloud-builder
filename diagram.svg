<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 990" width="1320" height="990">
<rect x="0" y="0" width="1320" height="990" fill="#FFFFFF"/>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#5F6368"/>
</marker>
<style>
  text { font-family: sans-serif; }
</style>
</defs>
<text x="660" y="40" text-anchor="middle" font-size="28" fill="#5F6368" font-family="sans-serif">Whiteboard-to-Cloud - Generated Architecture</text>

<!-- VPC Container -->
<rect x="732.6" y="94.05" width="561" height="608.85" rx="16" ry="16" fill="#E8F0FE" stroke="#4285F4" stroke-width="2"/>
<text x="752.6" y="124.05" font-size="18" font-weight="600" fill="#4285F4">VPC Network</text>

<!-- Edges (behind boxes for clean) -->
<!-- USERS -> CLOUD LOAD BALANCER -->
<line x1="302.81" y1="247.5" x2="294.69" y2="331.65" stroke="#5F6368" stroke-width="2" marker-end="url(#arrow)"/>
<!-- CLOUD LOAD BALANCER -> CLOUD RUN SERVICE -->
<line x1="300.3" y1="420.75" x2="315.7" y2="490.05" stroke="#5F6368" stroke-width="2" marker-end="url(#arrow)"/>
<!-- CLOUD RUN SERVICE -> Firewall -->
<line x1="432.41" y1="490.05" x2="918.64" y2="262.35" stroke="#5F6368" stroke-width="2" marker-end="url(#arrow)"/>
<!-- Firewall -> Compute VM -->
<line x1="1000.32" y1="262.35" x2="997.44" y2="301.95" stroke="#5F6368" stroke-width="2" marker-end="url(#arrow)"/>
<!-- Compute VM -> Cloud SQL -->
<line x1="993.3" y1="415.8" x2="993.3" y2="460.35" stroke="#5F6368" stroke-width="2" marker-end="url(#arrow)"/>
<!-- CLOUD RUN SERVICE -> CLOUD STORAGE -->
<line x1="350.7" y1="589.05" x2="429.9" y2="752.4" stroke="#5F6368" stroke-width="2" marker-end="url(#arrow)"/>
<!-- Compute VM -> CLOUD STORAGE -->
<line x1="931.51" y1="415.8" x2="565.96" y2="752.4" stroke="#5F6368" stroke-width="2" marker-end="url(#arrow)"/>

<!-- Boxes -->
<!-- USERS external ellipse -->
<ellipse cx="310.2" cy="170.775" rx="132" ry="76.725" fill="#FFFFFF" stroke="#202124" stroke-width="2"/>
<text x="310.2" y="165.775" text-anchor="middle" font-size="20" font-weight="600" fill="#202124">USERS</text>
<text x="310.2" y="188.775" text-anchor="middle" font-size="14" fill="#5F6368">(HTTPS)</text>

<!-- CLOUD LOAD BALANCER -->
<rect x="158.4" y="331.65" width="264" height="89.1" rx="8" ry="8" fill="#FFFFFF" stroke="#202124" stroke-width="2"/>
<text x="290.4" y="381.2" text-anchor="middle" font-size="20" font-weight="600" fill="#202124">CLOUD LOAD BALANCER</text>

<!-- CLOUD RUN SERVICE -->
<rect x="145.2" y="490.05" width="363" height="99" rx="8" ry="8" fill="#FFFFFF" stroke="#202124" stroke-width="2"/>
<text x="326.7" y="534.55" text-anchor="middle" font-size="20" font-weight="600" fill="#202124">CLOUD RUN SERVICE</text>
<text x="326.7" y="556.55" text-anchor="middle" font-size="14" fill="#5F6368">Serverless FE</text>

<!-- CLOUD STORAGE -->
<rect x="283.8" y="752.4" width="376.2" height="173.25" rx="8" ry="8" fill="#FFFFFF" stroke="#202124" stroke-width="2"/>
<text x="471.9" y="815.4" text-anchor="middle" font-size="20" font-weight="600" fill="#202124">CLOUD STORAGE</text>
<text x="471.9" y="837.4" text-anchor="middle" font-size="14" fill="#5F6368">Bucket</text>
<text x="471.9" y="855.4" text-anchor="middle" font-size="14" fill="#5F6368">Files &amp; Static Assets</text>

<!-- Firewall Rule -->
<rect x="778.8" y="183.15" width="448.8" height="79.2" rx="8" ry="8" fill="#FFFFFF" stroke="#202124" stroke-width="2"/>
<text x="1003.2" y="213.15" text-anchor="middle" font-size="18" font-weight="600" fill="#202124">Firewall Rule</text>
<text x="1003.2" y="235.15" text-anchor="middle" font-size="18" font-weight="600" fill="#202124">Allow TCP: 8080</text>

<!-- Compute Engine VM -->
<rect x="805.2" y="301.95" width="376.2" height="113.85" rx="8" ry="8" fill="#FFFFFF" stroke="#202124" stroke-width="2"/>
<text x="993.3" y="348.95" text-anchor="middle" font-size="20" font-weight="600" fill="#202124">Compute Engine VM</text>
<text x="993.3" y="370.95" text-anchor="middle" font-size="14" fill="#5F6368">Backend in Private Subnet</text>

<!-- Cloud SQL -->
<rect x="805.2" y="460.35" width="376.2" height="138.6" rx="8" ry="8" fill="#FFFFFF" stroke="#202124" stroke-width="2"/>
<text x="993.3" y="519.65" text-anchor="middle" font-size="20" font-weight="600" fill="#202124">Cloud SQL</text>
<text x="993.3" y="541.65" text-anchor="middle" font-size="14" fill="#5F6368">Postgres</text>

<!-- Mechanism labels with white halo -->
<g>
<rect x="605" y="362" width="142" height="18" fill="white" opacity="0.9"/>
<text x="675.52" y="376.2" text-anchor="middle" font-size="12" font-weight="600" fill="#34A853">Direct VPC Egress</text>
</g>
<g>
<rect x="908" y="429" width="170" height="18" fill="white" opacity="0.9"/>
<text x="993.3" y="443.075" text-anchor="middle" font-size="12" font-weight="600" fill="#34A853">Private Service Access</text>
</g>
<g>
<rect x="663" y="575" width="172" height="18" fill="white" opacity="0.9"/>
<text x="748.73" y="589.1" text-anchor="middle" font-size="12" font-weight="600" fill="#34A853">Private Google Access</text>
</g>
</svg>