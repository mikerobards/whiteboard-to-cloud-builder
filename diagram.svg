<rect x="63.36" y="346.5" width="348.48" height="126.72" rx="8" ry="8" fill="white" stroke="#202124" stroke-width="2"/>
<!-- Component: Cloud Storage Bucket -->
<rect x="306.24" y="730.62" width="580.8" height="172.26" rx="8" ry="8" fill="white" stroke="#202124" stroke-width="2"/>
<!-- External: USERS (HTTPS) -->
<ellipse cx="195.36" cy="212.85" rx="171.6" ry="46.53" fill="white" stroke="#202124" stroke-width="2"/>

<!-- Arrows -->
<line x1="195.36" y1="259.38" x2="237.6" y2="346.5" stroke="#5F6368" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="411.84" y1="409.86" x2="653.4" y2="383.13" stroke="#5F6368" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="943.8" y1="417.78" x2="968.22" y2="467.28" stroke="#5F6368" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="293.51" y1="473.22" x2="520.64" y2="730.62" stroke="#5F6368" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="884.36" y1="595.98" x2="708.9" y2="730.62" stroke="#5F6368" stroke-width="2" marker-end="url(#arrow)"/>

<!-- Connection labels (mechanism) -->
